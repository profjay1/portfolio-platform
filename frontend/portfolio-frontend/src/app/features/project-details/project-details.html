<section class="project-details-section">
  <div class="container">
    <p class="section-label">Project Details</p>

    <h1>Selected Project</h1>

    <p class="project-id">
      Project ID:
      <strong>{{ projectId }}</strong>
    </p>

    <p class="placeholder-message">
      This page confirms that Angular successfully received the selected
      project ID from the URL. We will replace this placeholder with the
      project’s complete information in the next stage.
    </p>

    <button
      type="button"
      class="back-button"
      (click)="returnToProjects()"
    >
      Back to Projects
    </button>
  </div>
</section>
